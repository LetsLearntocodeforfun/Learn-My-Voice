# Builds a release candidate from every push to a beta branch (beta/<anything>), and publishes it as a
# pre-release on GitHub with the package attached, so that people can download and try it.
#
#   tests    the whole test suite on macOS, Windows and Linux (tests.yml)
#   build    one zip, built twice and compared: the same commit always gives the same bytes
#   try      on each system: unpack that zip, start it with the launcher a person would double-click,
#            use the running app, stop it
#   desktop  on macOS (Apple chip and Intel chip) and Windows: build the desktop app's installer around that
#            same zip and a Python of its own, install it, open the app, use it, end it
#            (desktop/build.py, desktop/try_installer.py)
#   publish  a pre-release named v<version>.rc.<run number>, with the zip, its SHA-256, each installer
#            whose trial passed, and notes that say per system what the jobs above found
#
# Nothing is published unless the tests pass on macOS, Linux and Windows, the trial passes on macOS, the one
# system the app has been used on by a person, and there is an installer of the desktop app for macOS and one
# for Windows that passed its own trial: a release candidate is what people download, so each one has
# something to install. The trial on Windows and Linux is allowed to fail for now; the notes then say so in
# words, with what those jobs reported. An installer is attached only when its own trial passed. Of the two
# for macOS one is enough: when GitHub has no Mac of one kind to give, or one of the two fails, the other
# still goes out, and the notes say what happened to the first.
#
# A job that fails says why in an annotation at the top of the run's page, which can be read without signing in.
#
# Only the publish job may write to the repository. No job uses a secret other than the token GitHub
# gives every run. Actions are pinned to a commit. Text that comes from the push (the branch name) is
# handed to scripts through the environment and never written into a command line.
name: Release candidate

on:
  push:
    branches: ["beta/**"]

permissions:
  contents: read

# No run is stopped or held back by a later push: every commit that was pushed gets its own run, and its own
# release candidate when it passes. (On 17 November two runs were cancelled by the pushes that followed them,
# one of them minutes before it would have published the first working Windows installer.)

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    name: Build the package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.build.outputs.version }}
      tag: ${{ steps.build.outputs.tag }}
      file: ${{ steps.build.outputs.file }}
      sha256: ${{ steps.build.outputs.sha256 }}
    env:
      RC_NUMBER: ${{ github.run_number }}
      RC_ATTEMPT: ${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0     # v7.1.0
        with:
          python-version: "3.13"
      - name: Build
        id: build
        shell: bash
        run: python tools/build_release.py build --rc "$RC_NUMBER" --attempt "$RC_ATTEMPT" --out dist
      - name: Build it again and compare
        shell: bash
        run: |
          python tools/build_release.py build --rc "$RC_NUMBER" --attempt "$RC_ATTEMPT" --out again
          cmp dist/*.zip again/*.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: package
          path: dist/
          if-no-files-found: error
          overwrite: true           # a run started again builds its own package, numbered as that attempt
          retention-days: 14

  try:
    name: Try it / ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # macos-15-intel and not macos-latest: see the note in tests.yml.
        os: [macos-15-intel, windows-latest, ubuntu-24.04]
        # The oldest Python supported and the newest. The launcher uses whichever Python the system
        # has; the second start in the trial uses this one.
        python: ["3.9", "3.15"]
        include:
          - os: macos-15-intel
            experimental: false
          - os: windows-latest
            experimental: true
          - os: ubuntu-24.04
            experimental: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0     # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      # These steps run in each system's own shell (PowerShell on Windows, as nothing here needs another).
      # The scripts take what they need from the environment, so the command lines hold no variable.
      - name: Unpack it, start it with its launcher, use it
        id: trial
        env:
          TRY_PACKAGE: dist/${{ needs.build.outputs.file }}
          TRY_SHA256: ${{ needs.build.outputs.sha256 }}
          TRY_LABEL: ${{ matrix.os }} / Python ${{ matrix.python }}
          TRY_RESULT: results/try-${{ matrix.os }}-py${{ matrix.python }}.json
        run: python tools/try_release.py
      # If the step above never got as far as writing its result, this writes down that it did not.
      - name: Write down a job that left no result
        if: ${{ always() }}
        env:
          RESULT_LABEL: ${{ matrix.os }} / Python ${{ matrix.python }}
          RESULT_OUTCOME: ${{ steps.trial.outcome }}
          RESULT_FILE: results/try-${{ matrix.os }}-py${{ matrix.python }}.json
        run: python tools/build_release.py result --kind try --if-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ always() }}
        with:
          name: result-try-${{ matrix.os }}-py${{ matrix.python }}
          path: results/
          if-no-files-found: error
          overwrite: true           # a job started again replaces what its earlier attempt left
          retention-days: 14

  desktop:
    name: Desktop app / ${{ matrix.system }}
    needs: build
    runs-on: ${{ matrix.os }}
    continue-on-error: true         # the publish job decides from what these jobs wrote down: see the first lines
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: macos-arm64
            os: macos-latest
            ending: .dmg
          - system: macos-x64
            os: macos-15-intel
            ending: .dmg
          - system: windows-x64
            os: windows-latest
            ending: -setup.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0     # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      # What Rust has downloaded and compiled is kept between runs: without it every build starts from nothing.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9            # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: desktop-${{ matrix.system }}-${{ hashFiles('desktop/src-tauri/Cargo.toml', 'desktop/src-tauri/Cargo.lock') }}
          restore-keys: desktop-${{ matrix.system }}-
      # The scripts take what they need from the environment, so the command lines hold no variable.
      - name: Build the installer
        env:
          DESKTOP_PACKAGE: dist/${{ needs.build.outputs.file }}
          DESKTOP_OUT: installers
          DESKTOP_RESULT: results/desktop-${{ matrix.system }}.json
        run: python desktop/build.py
      - name: Install it, open the app, use it, end it
        id: trial
        env:
          INSTALLER: installers/*-${{ matrix.system }}${{ matrix.ending }}
          INSTALLER_RESULT: results/desktop-${{ matrix.system }}.json
          INSTALLER_SHOTS: installers
          INSTALLER_LABEL: ${{ matrix.system }}
        run: python desktop/try_installer.py
      # If neither step above got as far as writing a result, this writes down that they did not.
      - name: Write down a job that left no result
        if: ${{ always() }}
        env:
          RESULT_LABEL: ${{ matrix.system }}
          RESULT_OUTCOME: ${{ steps.trial.outcome }}
          RESULT_FILE: results/desktop-${{ matrix.system }}.json
        run: python tools/build_release.py result --kind desktop --if-missing
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ always() }}
        with:
          name: result-desktop-${{ matrix.system }}
          path: results/
          if-no-files-found: error
          overwrite: true           # a job started again replaces what its earlier attempt left
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: ${{ always() }}
        with:
          name: installer-${{ matrix.system }}
          path: installers/
          if-no-files-found: ignore # a build that failed has made none
          overwrite: true
          retention-days: 14

  publish:
    name: Publish the release candidate
    needs: [tests, build, try, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write           # to create the pre-release and its tag; no other job can write
    env:
      PACKAGE: ${{ needs.build.outputs.file }}
      SHA256: ${{ needs.build.outputs.sha256 }}
      TAG: ${{ needs.build.outputs.tag }}
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1         # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0     # v7.1.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true     # there are none when no installer could be built
        with:
          pattern: installer-*
          path: installers
          merge-multiple: true
      # The notes are written from what each job wrote down. This step fails, and nothing is published,
      # if the tests or the trial did not pass on macOS, or the tests on Linux or Windows, or if macOS or Windows
      # has no installer that passed its trial, whatever the jobs' own colours say.
      - name: Check the package and write the notes
        shell: bash
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          python tools/build_release.py verify "dist/$PACKAGE" --sha256 "$SHA256"
          python tools/build_release.py notes --package "dist/$PACKAGE" --results results \
            --require macos --require linux:tests --require windows:tests \
            --require macos:desktop --require windows:desktop \
            --legs tests=3 --legs try=2 --run-url "$RUN_URL" --branch "$BRANCH" \
            --installers installers --attach attach.txt --out notes.md
          cat notes.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publish it as a pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < attach.txt     # the package, its checksum, and each installer whose trial passed
          gh release create "$TAG" "${FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "$VERSION (release candidate)" --notes-file notes.md
